# 826 Auto Aesthetic & Protection on Radiance Flow (owner, 2026-11-22: "gawan ng pipeline ang 826. kasama ang test automation").
# CI on every push to main and every pull request into main: PHP and Node dependencies, code style, the front-end build,
# PHPUnit with coverage, then the Playwright browser tests (tests/e2e) against `php artisan serve` on a seeded throwaway
# SQLite file. Runs on ribs02. Secrets: only the GitHub token Flow itself hands to `uses` steps. The run uses .env.example
# with a fresh `php artisan key:generate`.
#
# The jobs and steps now come from Radiance-Philippines/devops-utilities (owner, 2026-11-23: "gusto ko ganon ang lahat ng
# ci kita ang jobs at steps ... yung reusable ay ilagay sa devops-utilities"). Flow expands every `template:` entry before
# the run starts, so the run page lists each step (deps_install, style_pint, phpunit_phpunit, ...) and which template file
# it came from. The templates are pinned to the tag v1.0.0.
#
# Reports: JUnit XML of both suites goes to Flow's test-report step (totals and failed tests on the run and the check).
# Coverage: pcov, Clover, Flow's coverage step. On a pull request the changed lines must be covered at least `diff_min`
# percent (80) or the run fails; on main the overall coverage is reported and nothing is gated.
# The Playwright HTML report, screenshots and traces stay in the run's workspace on ribs02 (playwright-report/,
# test-results/) for 24 hours; Flow has no artifact upload step yet.
# Deploy to Hostinger is NOT in this file: it is added later, when 826 gives collaborator access.
name: 826-ci
description: 826 website - Composer, npm, Pint, build, PHPUnit with coverage and Playwright tests on ribs02
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  manual: true
resources:
  repositories:
    - repository: devops-utilities
      ref: v1.0.0
steps:
  checkout:
    uses: checkout
    queue: ribs
    runs_on: [ribs02]
    network: true
    with: { repo: "${{ source.repo }}", sha: "${{ source.sha }}" }
    env: { GITHUB_TOKEN: "${{ secrets.github }}" }

  deps:
    template: laravel/deps.yml@devops-utilities
    needs: [checkout]

  style:
    template: laravel/pint.yml@devops-utilities
    needs: [deps]

  build:
    template: node/build.yml@devops-utilities
    needs: [deps]

  phpunit:
    template: laravel/test-coverage.yml@devops-utilities
    needs: [build]
    parameters:
      pcov_dir: app

  e2e:
    template: playwright/e2e.yml@devops-utilities
    needs: [build]

  tests:
    template: report/test-report.yml@devops-utilities
    needs: [phpunit, e2e]

  coverage:
    template: report/coverage.yml@devops-utilities
    needs: [phpunit]
    parameters:
      diff_min: 80

  verdict:
    template: report/verdict.yml@devops-utilities
    needs: [style, tests, coverage]
    parameters:
      statuses:
        PHPUNIT_STATUS: "${{ steps.phpunit_phpunit.outputs.status }}"
        E2E_STATUS: "${{ steps.e2e_e2e.outputs.status }}"
